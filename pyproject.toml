[project]
name = "genai-mri-superres"
version = "0.1.0"
description = "Super-risoluzione image-to-image di immagini mediche 2D con CNN generativa compatta (ESPCN/SRCNN) su MedMNIST"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "medmnist>=3.0",
    "streamlit>=1.36",
    "nibabel>=5.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srmri"]

[tool.ruff]
line-length = 100
target-version = "py312"
# I notebook usano uno stile a celle (statement compatti con ';' per le figure):
# esclusi dal lint per non snaturarli.
extend-exclude = ["notebooks"]

[tool.ruff.lint.per-file-ignores]
# Nei notebook e negli script il pattern sys.path.insert prima degli import
# del package è intenzionale (E402); i moduli scientifici vanno importati
# dopo aver configurato il backend matplotlib.
"*.ipynb" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
