[project]
name = "genai-mri-superres"
version = "0.1.0"
description = "Image-to-image super-resolution of 2D medical images with a compact generative CNN (ESPCN/SRCNN) on MedMNIST BloodMNIST, plus a real brain MRI track"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "medmnist>=3.0",
    "streamlit>=1.36",
    "nibabel>=5.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srmri"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks use a cell style (compact statements with ';' for figures):
# they are excluded from linting to keep that style.
extend-exclude = ["notebooks"]

[tool.ruff.lint.per-file-ignores]
# In notebooks and scripts, sys.path.insert before the package imports is
# intentional (E402); scientific modules must be imported after the
# matplotlib backend has been configured.
"*.ipynb" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
